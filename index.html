<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

    .info {
      font-size: 18px;
      margin: 15px 0;
      font-weight: bold;
    }
    .btn {
      display: block;
      background: #25D366;
      color: white;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      transition: 0.3s;
    }
    .btn:hover {
      background: #128C7E;
    }
    .group-btn {
      background: #007bff;
    }
    .group-btn:hover {
      background: #0056b3;
