<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Cart - HQ Shop For</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="container">
            <div class="logo">HQ<span>SHOP FOR</span></div>
            <div class="search-box"><input type="text" placeholder="Search..."></div>
            <div class="nav-icons">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="cart.html">Cart 🛒 <span id="cart-count">0</span></a>
            </div>
        </div>
    </div>

    <div class="container" style="background:white; margin:20px auto; padding:30px; border-radius:8px; min-height:400px;">
        <h2 class="section-title">Your Shopping Cart</h2>
        <div id="cart-items">
            <p>Your cart is empty. <a href="products.html">Shop Now</a></p>
        </div>
        <div id="cart-total" style="text-align:right; font-size:20px; font-weight:bold; margin-top:20px;"></div>
        <button id="checkout-btn" style="display:none; width:100%; padding:15px; background:#FF6F00; color:white; border:none; border-radius:6px; font-size:18px; margin-top:20px;">Proceed to Checkout</button>
    </div>

<script>
// Cart ko LocalStorage se load karo
let cart = JSON.parse(localStorage.getItem('cart')) || [];
const cartItemsDiv = document.getElementById('cart-items');
const cartTotalDiv = document.getElementById('cart-total');
const checkoutBtn = document.getElementById('checkout-btn');
const cartCount = document.getElementById('cart-count');

function displayCart(){
    if(cart.length === 0){
        cartItemsDiv.innerHTML = '<p>Your cart is empty. <a href="products.html">Shop Now</a></p>';
        cartTotalDiv.innerHTML = '';
        checkoutBtn.style.display = 'none';
        cartCount.innerText = 0;
        return;
    }
    
    let total = 0;
    let html = '';
    cart.forEach((item, index) => {
        total += item.price;
        html += `
        <div style="display:flex; justify-content:space-between; border-bottom:1px solid #eee; padding:15px 0;">
            <div>
                <h4>${item.name}</h4>
                <p style="color:#FF6F00; font-weight:bold;">$${item.price}</p>
            </div>
            <button onclick="removeItem(${index})" style="background:red; color:white; border:none; padding:5px 10px; border-radius:4px;">Remove</button>
        </div>
        `;
    });
    
    cartItemsDiv.innerHTML = html;
    cartTotalDiv.innerHTML = 'Total: $' + total.toFixed(2);
    checkoutBtn.style.display = 'block';
    cartCount.innerText = cart.length;
}

function removeItem(index){
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    displayCart();
}

displayCart();
</script>

</body>
</html>
